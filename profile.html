<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Profile</title>
    <script>
        (function() {
            const savedLang = localStorage.getItem('language') || 'en';
            const savedTheme = localStorage.getItem('theme');
            const html = document.documentElement;

            if (savedLang === 'ar') {
                html.setAttribute('lang', 'ar');
                html.setAttribute('dir', 'rtl');
            } else {
                html.setAttribute('lang', 'en');
                html.setAttribute('dir', 'ltr');
            }

            if (savedTheme === 'dark') {
                html.classList.add('dark-mode');
            }
        })();
    </script>

    <!-- Standard / RTL Bootstrap CSS dynamically loaded -->
    <link rel="stylesheet" id="bootstrapCss" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet" href="theme-toggle.css">
    <script src="theme-toggle.js"></script>
</head>
<body>

<!-- Mobile Navbar -->
<nav class="navbar navbar-dark bg-dark d-md-none px-3 mb-3">
    <a class="navbar-brand fw-bold" href="#">
        <i class="bi bi-check2-square me-1"></i> <span data-i18n="appName">TaskFlow</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar" aria-controls="mobileSidebar">
        <span class="navbar-toggler-icon"></span>
    </button>
</nav>

<div class="container-fluid">
    <div class="row">
        
        <!-- Sidebar Navigation -->
        <aside class="col-md-3 col-lg-2 offcanvas-md offcanvas-start bg-dark text-white p-3 min-vh-100 d-flex flex-column justify-content-between" id="mobileSidebar" tabindex="-1">
            <div class="w-100">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="text-white m-0">
                        <i class="bi bi-check2-square"></i> <span data-i18n="appName">TaskFlow</span>
                    </h3>
                    <button type="button" class="btn-close btn-close-white d-md-none" data-bs-dismiss="offcanvas" data-bs-target="#mobileSidebar" aria-label="Close"></button>
                </div>
                
                <ul class="nav flex-column gap-1">
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="dashboard.html">
                            <i class="bi bi-grid me-2"></i> <span data-i18n="dashboard">Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="mytasks.html">
                            <i class="bi bi-list-task me-2"></i> <span data-i18n="myTasks">My Tasks</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="calendar.html">
                            <i class="bi bi-calendar3 me-2"></i> <span data-i18n="calendar">Calendar</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active text-white fw-bold" href="#">
                            <i class="bi bi-person me-2"></i> <span data-i18n="profile">Profile</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="settings.html">
                            <i class="bi bi-gear me-2"></i> <span data-i18n="settings">Settings</span>
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Logout Link -->
            <ul class="nav flex-column mt-auto pt-3 border-top border-secondary w-100">
                <li class="nav-item">
                    <a class="nav-link text-danger" href="index.html" onclick="logout()">
                        <i class="bi bi-box-arrow-right me-2"></i> <span data-i18n="logout">Logout</span>
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="col-md-9 col-lg-10 ms-sm-auto px-md-4 py-3">
            
            <header class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold m-0" data-i18n="profileSettings">Profile Settings</h2>
                    <p class="text-muted m-0" data-i18n="profileSubtitle">Manage your profile information and account details.</p>
                </div>
                <!-- Theme Toggle Button -->
                <button class="btn btn-light rounded-circle shadow-sm p-2 notif-btn" id="themeToggleBtn" title="Toggle Theme">
                    <i class="bi bi-moon-stars fs-5 text-secondary" id="themeIcon"></i>
                </button>
            </header>

            <div class="row g-4">
                
                <!-- Left Column: Summary Card -->
                <div class="col-12 col-lg-4">
                    <div class="card border-0 shadow-sm text-center p-4">
                        
                        <!-- Avatar Section -->
                        <div class="position-relative d-inline-block mx-auto mb-3">
                            <img id="profileImage" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' fill='%236c757d' class='bi bi-person-circle' viewBox='0 0 16 16'><path d='M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z'/><path fill-rule='evenodd' d='M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1z'/></svg>" class="rounded-circle object-fit-cover shadow-sm bg-light" width="100" height="100" alt="Profile Picture">
                            
                            <!-- Change Avatar Button -->
                            <label for="editAvatarInput" class="position-absolute bottom-0 end-0 bg-primary text-white rounded-circle shadow-sm cursor-pointer d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;" title="Change Photo">
                                <i class="bi bi-camera-fill small"></i>
                            </label>

                            <!-- Remove Avatar Button -->
                            <button type="button" id="removeAvatarBtn" class="position-absolute top-0 end-0 bg-danger text-white border-0 rounded-circle shadow-sm d-none align-items-center justify-content-center" style="width: 24px; height: 24px;" title="Remove Photo">
                                <i class="bi bi-x-lg extra-small"></i>
                            </button>
                        </div>

                        <h4 class="fw-bold mb-1" id="profileDisplayName">-</h4>
                        <p class="text-primary small mb-2 fw-semibold" id="profileDisplayOccupation">-</p>
                        <p class="text-muted small mb-3" id="profileDisplayBio">-</p>
                        
                        <div class="d-flex justify-content-center gap-3 text-muted small mb-3">
                            <span id="profileDisplayLocation"><i class="bi bi-geo-alt me-1"></i><span id="profileDisplayCountry">-</span></span>
                            <span id="profileDisplayPhoneContainer"><i class="bi bi-telephone me-1"></i><span id="profileDisplayPhone">-</span></span>
                        </div>

                        <hr>

                        <!-- Task Stats -->
                        <div class="row text-center pt-2 mb-3">
                            <div class="col-4 border-end px-1">
                                <h5 class="fw-bold m-0" id="userTotalTasks">0</h5>
                                <span class="text-muted small" data-i18n="total">Total</span>
                            </div>
                            <div class="col-4 border-end px-1">
                                <h5 class="fw-bold text-primary m-0" id="userPendingTasks">0</h5>
                                <span class="text-muted small" data-i18n="pending">Pending</span>
                            </div>
                            <div class="col-4 px-1">
                                <h5 class="fw-bold text-success m-0" id="userCompletedTasks">0</h5>
                                <span class="text-muted small" data-i18n="done">Done</span>
                            </div>
                        </div>

                        <!-- Completion Rate Progress Bar -->
                        <div class="text-start mt-2">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <span class="small fw-bold text-muted" data-i18n="completionRate">Completion Rate</span>
                                <span class="small fw-bold text-success" id="completionRateText">0%</span>
                            </div>
                            <div class="progress" style="height: 8px;">
                                <div class="progress-bar bg-success" id="completionProgressBar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- Right Column: Form -->
                <div class="col-12 col-lg-8">
                    <div class="card border-0 shadow-sm p-4">
                        <h5 class="fw-bold mb-3"><i class="bi bi-person-gear me-2"></i> <span data-i18n="editProfileTitle">Edit Profile Information</span></h5>
                        
                        <div id="profileAlert" class="alert d-none" role="alert"></div>

                        <form id="profileForm">
                            <!-- Image Input -->
                            <div class="mb-3">
                                <label for="editAvatarInput" class="form-label fw-bold" data-i18n="profilePicture">Profile Picture</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-image"></i></span>
                                    <input type="file" class="form-control" id="editAvatarInput" accept="image/*">
                                </div>
                            </div>

                            <!-- Username & Email -->
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="editUsername" class="form-label fw-bold" data-i18n="username">Username</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                                        <input type="text" class="form-control" id="editUsername" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="editEmail" class="form-label fw-bold" data-i18n="emailAddress">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                        <input type="email" class="form-control" id="editEmail" required>
                                    </div>
                                </div>
                            </div>

                            <!-- Occupation & Country -->
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="editOccupation" class="form-label fw-bold" data-i18n="occupation">Occupation</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-briefcase"></i></span>
                                        <input type="text" class="form-control" id="editOccupation">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="editCountry" class="form-label fw-bold" data-i18n="country">Country</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-globe"></i></span>
                                        <input type="text" class="form-control" id="editCountry">
                                    </div>
                                </div>
                            </div>

                            <!-- Phone -->
                            <div class="mb-3">
                                <label for="editPhone" class="form-label fw-bold" data-i18n="phone">Phone Number</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                    <input type="tel" class="form-control" id="editPhone">
                                </div>
                            </div>

                            <!-- Bio -->
                            <div class="mb-3">
                                <label for="editBio" class="form-label fw-bold" data-i18n="bio">Bio</label>
                                <textarea class="form-control" id="editBio" rows="3" style="resize: none;"></textarea>
                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-4">
                                <button type="submit" class="btn btn-primary w-100 w-sm-auto px-4" data-i18n="saveChanges">Save Changes</button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>

        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="profile.js"></script>
</body>
</html>
