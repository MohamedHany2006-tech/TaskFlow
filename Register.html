<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Register</title>

    <link href="bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style(L).css">
    <link rel="stylesheet" href="theme-toggle.css">
    <link rel="stylesheet" href="theme-toggle.css">
</head>

<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card login-card">
                <div class="row g-0">
<!-- Left -->
                    <div class="col-lg-5 d-none d-lg-flex flex-column justify-content-center left-side">

                        <div class="logo mb-3">

                            <i class="bi bi-check2-square"></i>

</div>

<h1>TaskFlow</h1>

<p class="mt-3 text-light">

Organize your work.<br>

Increase your productivity.<br>

Manage everything in one place.

</p>

<hr class="text-secondary">

<p class="small text-secondary">

✔ Manage Tasks

<br>

✔ Track Progress

<br>

✔ Stay Organized

</p>

</div>

<!-- Right -->
<div class="col-lg-7 right-side">
                        <h2 class="fw-bold">Create Account 🚀</h2>
                        <p class="text-muted">Create your account to start managing your tasks.</p>

                        <!-- تنبيه الأخطاء أو النجاح -->
                        <div id="alertMessage" class="alert d-none" role="alert"></div>

                        <form id="registerForm">
                            <div class="mb-3">
                                <label for="regUsername" class="form-label">User Name</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" placeholder="Enter your username" id="regUsername" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="regEmail" class="form-label">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" placeholder="Enter your email" id="regEmail" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="regPassword" class="form-label">Password</label>
                                <div class="input-group mb-2">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" placeholder="Enter password" id="regPassword" required>
                                </div>

                                <label for="regConfirmPassword" class="form-label mt-2">Confirm Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                    <input type="password" class="form-control" placeholder="Re-enter password" id="regConfirmPassword" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="regTerms" required>
                                    <label class="form-check-label" for="regTerms">
                                        I agree to the Terms & Conditions
                                    </label>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-login w-100 fw-bold">Register</button>

                            <div class="text-center mt-4">
                                <p class="text-muted">
                                    Already have an account?
                                    <a href="index.html" class="text-decoration-none">Login</a>
                                </p>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="script(R).js"></script>
<script src="theme-toggle.js"></script>
</body>
</html>
