<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | My Tasks</title>
    <link rel="stylesheet" href="bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style(M).css">
</head>
<body>

<div class="container-fluid">
    <div class="row">
        
        <!-- Sidebar Navigation -->
        <aside class="col-md-3 col-lg-2 sidebar p-3 d-flex flex-column justify-content-between min-vh-100">
            <div>
                <h3 class="text-white mb-4">
                    <i class="bi bi-check2-square"></i>
                    TaskFlow
                </h3>
                
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">
                            <i class="bi bi-grid me-2"></i>
                            Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="#">
                            <i class="bi bi-list-task me-2"></i>
                            My Tasks
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="profile.html">
                            <i class="bi bi-person me-2"></i>
                            Profile
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="settings.html">
                            <i class="bi bi-gear me-2"></i>
                            Settings
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Logout Link in Bottom -->
            <ul class="nav flex-column mt-auto pt-3 border-top border-secondary">
                <li class="nav-item">
                    <a class="nav-link text-danger" href="index.html">
                        <i class="bi bi-box-arrow-right me-2"></i>
                        Logout
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Main Content Wrapper -->
        <main class="col-md-9 col-lg-10 main-content p-4">
            
            <!-- Header Section -->
            <header class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold m-0">My Tasks</h2>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addTaskModal">
                    <i class="bi bi-plus-lg me-1"></i> Add Task
                </button>
            </header>
            
            <!-- Filters & Search Bar -->
            <section class="row g-3 mb-4">
                <div class="col-lg-5 col-md-12">
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-search"></i>
                        </span>
                        <!-- إضافة id="searchInput" -->
                        <input type="text" id="searchInput" class="form-control" placeholder="Search tasks...">
                    </div>
                </div>
                
                <div class="col-lg-2 col-md-4">
                    <!-- إضافة id="statusFilter" وتحديث الـ values -->
                    <select class="form-select" id="statusFilter" aria-label="Filter by status">
                        <option value="all" selected>All Statuses</option>
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
                
                <div class="col-lg-2 col-md-4">
                    <!-- إضافة id="priorityFilter" وتحديث الـ values -->
                    <select class="form-select" id="priorityFilter" aria-label="Filter by priority">
                        <option value="all" selected>All Priorities</option>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </div>
                
                <div class="col-lg-3 col-md-4">
                    <!-- إضافة id="categoryFilter" وتحديث الـ values -->
                    <select class="form-select" id="categoryFilter" aria-label="Filter by category">
                        <option value="all" selected>All Categories</option>
                        <option value="Work">Work</option>
                        <option value="Study">Study</option>
                        <option value="Personal">Personal</option>
                    </select>
                </div>
            </section>

            <!-- Task Cards Grid -->
            <section class="row g-3" id="tasksContainer">
                <!-- التاسكات المحفوظة بتنزل هنا -->
            </section>

        </main>
    </div>
</div>

<!-- Add Task Modal -->
<div class="modal fade" id="addTaskModal" tabindex="-1" aria-labelledby="addTaskModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="addTaskModalLabel">Add New Task</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="addTaskForm">
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="taskTitle" class="form-label fw-bold">Task Title</label>
                        <input type="text" class="form-control" id="taskTitle" placeholder="Enter task title" required>
                    </div>

                    <div class="mb-3">
                        <label for="taskDesc" class="form-label fw-bold">Description</label>
                        <textarea class="form-control" id="taskDesc" rows="3" placeholder="Enter task details"></textarea>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label for="taskPriority" class="form-label fw-bold">Priority</label>
                            <select class="form-select" id="taskPriority" required>
                                <option value="High">High</option>
                                <option value="Medium" selected>Medium</option>
                                <option value="Low">Low</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="taskCategory" class="form-label fw-bold">Category</label>
                            <select class="form-select" id="taskCategory" required>
                                <option value="Work" selected>Work</option>
                                <option value="Study">Study</option>
                                <option value="Personal">Personal</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="taskDate" class="form-label fw-bold">Due Date</label>
                        <input type="date" class="form-control" id="taskDate" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Task</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Edit Task Modal -->
<div class="modal fade" id="editTaskModal" tabindex="-1" aria-labelledby="editTaskModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="editTaskModalLabel">Edit Task</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="editTaskForm">
                <input type="hidden" id="editTaskId">
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="editTaskTitle" class="form-label fw-bold">Task Title</label>
                        <input type="text" class="form-control" id="editTaskTitle" required>
                    </div>

                    <div class="mb-3">
                        <label for="editTaskDesc" class="form-label fw-bold">Description</label>
                        <textarea class="form-control" id="editTaskDesc" rows="3"></textarea>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-md-4">
                            <label for="editTaskPriority" class="form-label fw-bold">Priority</label>
                            <select class="form-select" id="editTaskPriority" required>
                                <option value="High">High</option>
                                <option value="Medium">Medium</option>
                                <option value="Low">Low</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="editTaskCategory" class="form-label fw-bold">Category</label>
                            <select class="form-select" id="editTaskCategory" required>
                                <option value="Work">Work</option>
                                <option value="Study">Study</option>
                                <option value="Personal">Personal</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="editTaskStatus" class="form-label fw-bold">Status</label>
                            <select class="form-select" id="editTaskStatus" required>
                                <option value="Pending">Pending</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Completed">Completed</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="editTaskDate" class="form-label fw-bold">Due Date</label>
                        <input type="date" class="form-control" id="editTaskDate" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Update Task</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap Bundle JS -->
<script src="bootstrap.bundle.min.js"></script>
<script src="theme.js"></script>
<script>
    const tasksContainer = document.getElementById('tasksContainer');
    const addTaskForm = document.getElementById('addTaskForm');
    const editTaskForm = document.getElementById('editTaskForm');

    // عناصر البحث والتصفية
    const searchInput = document.getElementById('searchInput');
    const statusFilter = document.getElementById('statusFilter');
    const priorityFilter = document.getElementById('priorityFilter');
    const categoryFilter = document.getElementById('categoryFilter');

    // 1. استرجاع التاسكات عند فتح الصفحة
    document.addEventListener('DOMContentLoaded', () => {
        loadTasksFromLocalStorage();
        setupFilterListeners();
    });

    // 2. إعداد مستمعي الأحداث للفلترة والبحث
    function setupFilterListeners() {
        searchInput.addEventListener('input', filterAndRenderTasks);
        statusFilter.addEventListener('change', filterAndRenderTasks);
        priorityFilter.addEventListener('change', filterAndRenderTasks);
        categoryFilter.addEventListener('change', filterAndRenderTasks);
    }

    // 3. دالة الفلترة والتصفية الرئيسية
    function filterAndRenderTasks() {
        const tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        
        const searchValue = searchInput.value.toLowerCase().trim();
        const selectedStatus = statusFilter.value;
        const selectedPriority = priorityFilter.value;
        const selectedCategory = categoryFilter.value;

        const filteredTasks = tasks.filter(task => {
            // البحث في العنوان أو الوصف
            const matchesSearch = task.title.toLowerCase().includes(searchValue) || 
                                  (task.desc && task.desc.toLowerCase().includes(searchValue));

            // الفلترة حسب الحالة والأولوية والتصنيف
            const matchesStatus = selectedStatus === 'all' || task.status === selectedStatus;
            const matchesPriority = selectedPriority === 'all' || task.priority === selectedPriority;
            const matchesCategory = selectedCategory === 'all' || task.category === selectedCategory;

            return matchesSearch && matchesStatus && matchesPriority && matchesCategory;
        });

        // إعادة عرض التاسكات المفلترة
        renderTasksList(filteredTasks);
    }

    // 4. عرض قائمة المهام المفلترة
    function renderTasksList(tasks) {
        tasksContainer.innerHTML = '';

        if (tasks.length === 0) {
            tasksContainer.innerHTML = `
                <div class="col-12 text-center py-5">
                    <i class="bi bi-search fs-1 text-muted"></i>
                    <p class="text-muted mt-2 fs-5">No tasks match your filter/search criteria.</p>
                </div>
            `;
            return;
        }

        tasks.forEach(task => renderTaskCard(task));
    }

    // 5. إضافة مهمة جديدة
    addTaskForm.addEventListener('submit', function(e) {
        e.preventDefault();

        const taskData = {
            id: Date.now(),
            title: document.getElementById('taskTitle').value,
            desc: document.getElementById('taskDesc').value,
            priority: document.getElementById('taskPriority').value,
            category: document.getElementById('taskCategory').value,
            date: document.getElementById('taskDate').value,
            status: 'Pending'
        };

        saveTaskToLocalStorage(taskData);
        filterAndRenderTasks(); // تحديث القائمة بعد الإضافة

        addTaskForm.reset();
        const modalElement = document.getElementById('addTaskModal');
        const modal = bootstrap.Modal.getInstance(modalElement);
        modal.hide();
    });

    // 6. حفظ التعديلات عند تقديم نموذج التعديل
    editTaskForm.addEventListener('submit', function(e) {
        e.preventDefault();

        const id = Number(document.getElementById('editTaskId').value);
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

        const index = tasks.findIndex(task => task.id === id);
        if (index !== -1) {
            tasks[index].title = document.getElementById('editTaskTitle').value;
            tasks[index].desc = document.getElementById('editTaskDesc').value;
            tasks[index].priority = document.getElementById('editTaskPriority').value;
            tasks[index].category = document.getElementById('editTaskCategory').value;
            tasks[index].status = document.getElementById('editTaskStatus').value;
            tasks[index].date = document.getElementById('editTaskDate').value;

            localStorage.setItem('tasks', JSON.stringify(tasks));
            filterAndRenderTasks(); // إعادة عرض المهام المعدلة
        }

        const modalElement = document.getElementById('editTaskModal');
        const modal = bootstrap.Modal.getInstance(modalElement);
        modal.hide();
    });

    // فتح الـ Modal وتعبئة البيانات للتعديل
    function openEditModal(id) {
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        const task = tasks.find(t => t.id === id);

        if (task) {
            document.getElementById('editTaskId').value = task.id;
            document.getElementById('editTaskTitle').value = task.title;
            document.getElementById('editTaskDesc').value = task.desc;
            document.getElementById('editTaskPriority').value = task.priority;
            document.getElementById('editTaskCategory').value = task.category;
            document.getElementById('editTaskStatus').value = task.status;
            document.getElementById('editTaskDate').value = task.date;

            const editModal = new bootstrap.Modal(document.getElementById('editTaskModal'));
            editModal.show();
        }
    }

    // حفظ التاسك في LocalStorage
    function saveTaskToLocalStorage(task) {
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        tasks.push(task);
        localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    // تحميل كل التاسكات
   function loadTasksFromLocalStorage() {
    filterAndRenderTasks();
    }


    // بناء كارت المهمة
    function renderTaskCard(task) {
        const dateObj = new Date(task.date);
        const formattedDate = isNaN(dateObj) ? task.date : dateObj.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });

        let badgeColor = 'bg-secondary';
        if (task.priority === 'High') badgeColor = 'bg-danger';
        if (task.priority === 'Medium') badgeColor = 'bg-warning text-dark';
        if (task.priority === 'Low') badgeColor = 'bg-info text-dark';

        const cardHTML = `
            <div class="col-lg-4 col-md-6" id="task-${task.id}">
                <div class="card task-card h-100 shadow-sm">
                    <div class="card-body d-flex flex-column justify-content-between">
                        <div>
                            <div class="d-flex justify-content-between align-items-center">
                                <h5 class="card-title mb-0">${task.title}</h5>
                                <span class="badge ${badgeColor}">${task.priority}</span>
                            </div>
                            <p class="text-muted mt-3">${task.desc || ''}</p>
                        </div>
                        <div>
                            <hr>
                            <div class="d-flex justify-content-between small text-muted mb-2">
                                <span><i class="bi bi-folder me-1"></i> ${task.category}</span>
                                <span><i class="bi bi-calendar me-1"></i> ${formattedDate}</span>
                            </div>
                            <div>
                                <span class="badge bg-secondary">${task.status}</span>
                            </div>
                            <div class="mt-3 d-flex gap-2">
                                <button class="btn btn-outline-primary btn-sm flex-fill" aria-label="Edit Task" onclick="openEditModal(${task.id})">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button class="btn btn-outline-success btn-sm flex-fill" aria-label="Complete Task" onclick="toggleComplete(${task.id})">
                                    <i class="bi bi-check2"></i>
                                </button>
                                <button class="btn btn-outline-danger btn-sm flex-fill" aria-label="Delete Task" onclick="deleteTask(${task.id})">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;

        tasksContainer.insertAdjacentHTML('beforeend', cardHTML);
    }

    // مسح التاسك
    function deleteTask(id) {
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        tasks = tasks.filter(task => task.id !== id);
        localStorage.setItem('tasks', JSON.stringify(tasks));
        filterAndRenderTasks();
    }

    // تبديل حالة الإنجاز
    function toggleComplete(id) {
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        const task = tasks.find(t => t.id === id);
        if (task) {
            task.status = task.status === 'Completed' ? 'Pending' : 'Completed';
            localStorage.setItem('tasks', JSON.stringify(tasks));
            filterAndRenderTasks();
        }
    }
</script>
</body>
</html>
