<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Profile</title>
    <link href="bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style(M).css">
    <link rel="stylesheet" href="theme-toggle.css">
    <script src="theme-toggle.js"></script>
</head>
<body>

<!-- Mobile Navbar (Only visible on small screens) -->
<nav class="navbar navbar-dark bg-dark d-md-none px-3 mb-3">
    <a class="navbar-brand fw-bold" href="#">
        <i class="bi bi-check2-square me-1"></i> TaskFlow
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar" aria-controls="mobileSidebar">
        <span class="navbar-toggler-icon"></span>
    </button>
</nav>

<div class="container-fluid">
    <div class="row">
        
        <!-- Sidebar Navigation (Desktop Static & Mobile Offcanvas) -->
        <aside class="col-md-3 col-lg-2 offcanvas-md offcanvas-start bg-dark text-white p-3 min-vh-100 d-flex flex-column justify-content-between" id="mobileSidebar" tabindex="-1">
            <div class="w-100">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="text-white m-0">
                        <i class="bi bi-check2-square"></i> TaskFlow
                    </h3>
                    <button type="button" class="btn-close btn-close-white d-md-none" data-bs-dismiss="offcanvas" data-bs-target="#mobileSidebar" aria-label="Close"></button>
                </div>
                
                <ul class="nav flex-column gap-1">
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="dashboard.html">
                            <i class="bi bi-grid me-2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="mytasks.html">
                            <i class="bi bi-list-task me-2"></i> My Tasks
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active text-white fw-bold" href="#">
                            <i class="bi bi-person me-2"></i> Profile
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="settings.html">
                            <i class="bi bi-gear me-2"></i> Settings
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Logout Link in Bottom -->
            <ul class="nav flex-column mt-auto pt-3 border-top border-secondary w-100">
                <li class="nav-item">
                    <a class="nav-link text-danger" href="index.html">
                        <i class="bi bi-box-arrow-right me-2"></i> Logout
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Main Content Wrapper -->
        <main class="col-md-9 col-lg-10 ms-sm-auto px-md-4 py-3">
            
            <!-- Header Section -->
            <header class="mb-4">
                <h2 class="fw-bold m-0">Profile Settings</h2>
                <p class="text-muted m-0">Manage your profile information and account details.</p>
            </header>

            <div class="row g-4">
                
                <!-- Left Column: User Summary Card -->
                <div class="col-12 col-lg-4">
                    <div class="card border-0 shadow-sm text-center p-4">
                        
                        <!-- Avatar Section with Image Upload Overlay -->
                        <div class="position-relative d-inline-block mx-auto mb-3">
                            <img id="profileImage" src="https://via.placeholder.com/100" class="rounded-circle object-fit-cover shadow-sm" width="100" height="100" alt="Profile Picture">
                            <label for="editAvatarInput" class="position-absolute bottom-0 end-0 bg-primary text-white rounded-circle p-2 shadow-sm cursor-pointer" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;" title="Change Photo">
                                <i class="bi bi-camera-fill small"></i>
                            </label>
                        </div>

                        <h4 class="fw-bold mb-1" id="profileDisplayName">User Name</h4>
                        <p class="text-muted small mb-3" id="profileDisplayEmail">user@example.com</p>
                        
                        <hr>

                        <!-- Quick Task Stats -->
                        <div class="row text-center pt-2 mb-3">
                            <div class="col-4 border-end px-1">
                                <h5 class="fw-bold m-0" id="userTotalTasks">0</h5>
                                <span class="text-muted small">Total</span>
                            </div>
                            <div class="col-4 border-end px-1">
                                <h5 class="fw-bold text-primary m-0" id="userPendingTasks">0</h5>
                                <span class="text-muted small">Pending</span>
                            </div>
                            <div class="col-4 px-1">
                                <h5 class="fw-bold text-success m-0" id="userCompletedTasks">0</h5>
                                <span class="text-muted small">Done</span>
                            </div>
                        </div>

                        <!-- Completion Rate Progress Bar -->
                        <div class="text-start mt-2">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <span class="small fw-bold text-muted">Completion Rate</span>
                                <span class="small fw-bold text-success" id="completionRateText">0%</span>
                            </div>
                            <div class="progress" style="height: 8px;">
                                <div class="progress-bar bg-success" id="completionProgressBar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                            </div>
                        </div>

                    </div>
                </div>
                

                <!-- Right Column: Edit Profile Form -->
                <div class="col-12 col-lg-8">
                    <div class="card border-0 shadow-sm p-4">
                        <h5 class="fw-bold mb-3"><i class="bi bi-person-gear me-2"></i> Edit Profile Information</h5>
                        
                        <!-- Alert Message -->
                        <div id="profileAlert" class="alert d-none" role="alert"></div>

                        <form id="profileForm">
                            
                            <!-- Profile Picture Input -->
                            <div class="mb-3">
                                <label for="editAvatarInput" class="form-label fw-bold">Profile Picture</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-image"></i></span>
                                    <input type="file" class="form-control" id="editAvatarInput" accept="image/*">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="editUsername" class="form-label fw-bold">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="editUsername" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="editEmail" class="form-label fw-bold">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="editEmail" required>
                                </div>
                            </div>

                            <hr class="my-4">

                            <h6 class="fw-bold mb-3"><i class="bi bi-shield-lock me-2"></i> Change Password</h6>

                            <div class="mb-3">
                                <label for="editPassword" class="form-label">New Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="editPassword" placeholder="Leave blank to keep current password">
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-4">
                                <button type="submit" class="btn btn-primary w-100 w-sm-auto px-4">Save Changes</button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>

        </main>
    </div>
</div>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script(P).js"></script>
</body>
</html>
