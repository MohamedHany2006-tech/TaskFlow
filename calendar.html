<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Calendar</title>
    
    <script>
        (function() {
            const savedLang = localStorage.getItem('language') || 'en';
            const savedTheme = localStorage.getItem('theme');
            const html = document.documentElement;

            if (savedLang === 'ar') {
                html.setAttribute('lang', 'ar');
                html.setAttribute('dir', 'rtl');
            } else {
                html.setAttribute('lang', 'en');
                html.setAttribute('dir', 'ltr');
            }

            if (savedTheme === 'dark') {
                html.classList.add('dark-mode');
            }
        })();
    </script>

    <!-- Dynamic Bootstrap CSS -->
    <link rel="stylesheet" id="bootstrapCss" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- FullCalendar CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css">
    
    <link rel="stylesheet" href="calendar.css">
    <link rel="stylesheet" href="theme-toggle.css">
    <script src="theme-toggle.js"></script>
</head>
<body>

    <!-- Mobile Navbar -->
    <nav class="navbar navbar-dark bg-dark d-md-none px-3 mb-3">
        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-check2-square me-1"></i> <span data-i18n="appName">TaskFlow</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar" aria-controls="mobileSidebar">
            <span class="navbar-toggler-icon"></span>
        </button>
    </nav>

    <div class="container-fluid">
        <div class="row">

            <!-- Sidebar Navigation -->
            <aside class="col-md-3 col-lg-2 offcanvas-md offcanvas-start bg-dark text-white p-3 min-vh-100 d-flex flex-column justify-content-between" id="mobileSidebar" tabindex="-1">
                <div class="w-100">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h3 class="text-white m-0">
                            <i class="bi bi-check2-square"></i> <span data-i18n="appName">TaskFlow</span>
                        </h3>
                        <button type="button" class="btn-close btn-close-white d-md-none" data-bs-dismiss="offcanvas" data-bs-target="#mobileSidebar" aria-label="Close"></button>
                    </div>

                    <ul class="nav flex-column gap-1">
                        <li class="nav-item">
                            <a class="nav-link text-white-50" href="dashboard.html">
                                <i class="bi bi-grid me-2"></i> <span data-i18n="dashboard">Dashboard</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white-50" href="mytasks.html">
                                <i class="bi bi-list-task me-2"></i> <span data-i18n="myTasks">My Tasks</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active text-white fw-bold" href="#">
                                <i class="bi bi-calendar3 me-2"></i> <span data-i18n="calendar">Calendar</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white-50" href="profile.html">
                                <i class="bi bi-person me-2"></i> <span data-i18n="profile">Profile</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white-50" href="settings.html">
                                <i class="bi bi-gear me-2"></i> <span data-i18n="settings">Settings</span>
                            </a>
                        </li>
                    </ul>
                </div>

                <!-- Logout Link -->
                <ul class="nav flex-column mt-auto pt-3 border-top border-secondary w-100">
                    <li class="nav-item">
                        <a class="nav-link text-danger" href="index.html" onclick="logout()">
                            <i class="bi bi-box-arrow-right me-2"></i> <span data-i18n="logout">Logout</span>
                        </a>
                    </li>
                </ul>
            </aside>

            <!-- Main Content Wrapper -->
            <main class="col-md-9 col-lg-10 ms-sm-auto px-md-4 py-3">

                <!-- Header Section -->
                <header class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                    <div>
                        <h2 class="fw-bold mb-1" data-i18n="calendarOverview">Calendar Overview</h2>
                        <p class="text-muted m-0" data-i18n="calendarSubtitle">Manage your task deadlines and schedule visually.</p>
                    </div>

                    <div class="d-flex align-items-center gap-2">
                        <!-- Notification Dropdown -->
                        <div class="dropdown">
                            <button class="btn btn-light position-relative rounded-circle shadow-sm p-2 notif-btn" type="button" id="notifDropdown" data-bs-toggle="dropdown" aria-expanded="false" title="Notifications">
                                <i class="bi bi-bell fs-5 text-secondary"></i>
                                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none" id="notifBadge">0</span>
                            </button>
                            <div class="dropdown-menu dropdown-menu-end shadow border-0 p-2 notif-dropdown" aria-labelledby="notifDropdown">
                                <h6 class="dropdown-header fw-bold" data-i18n="notifications">Notifications</h6>
                                <div id="notifList" class="my-2" style="max-height: 250px; overflow-y: auto;">
                                    <p class="text-muted small text-center m-0 py-2" data-i18n="noNotifications">No new notifications</p>
                                </div>
                            </div>
                        </div>

                        <!-- Theme Toggle Button -->
                        <button class="btn btn-light rounded-circle shadow-sm p-2 notif-btn" id="themeToggleBtn" title="Toggle Theme">
                            <i class="bi bi-moon-stars fs-5 text-secondary" id="themeIcon"></i>
                        </button>
                    </div>
                </header>

                <!-- Calendar Card View -->
                <div class="row">
                    <div class="col-12">
                        <div id="calendar" class="card p-3 shadow-sm border-0"></div>
                    </div>
                </div>

             <!-- Modal تفاصيل اليوم إضافة حدث -->
            <div class="modal fade" id="dayModal" tabindex="-1" aria-labelledby="dayModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content border-0 shadow">
                        <div class="modal-header">
                            <h5 class="modal-title fw-bold" id="dayModalLabel">
                                <i class="bi bi-calendar-event me-2 text-primary"></i> 
                                <span data-i18n="eventsForDate">Events for:</span> <span id="selectedDateTitle" class="text-primary"></span>
                            </h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        
                        <div class="modal-body">
                            <!-- قائمة الأحداث المسجلة في هذا اليوم -->
                            <h6 class="fw-bold mb-2" data-i18n="dailySchedule">Daily Schedule & Tasks:</h6>
                            <div id="dayEventsList" class="mb-4"></div>

                            <hr>

                            <!-- نموذج إضافة حدث جديد سريع بنفس اليوم -->
                            <h6 class="fw-bold mb-3" data-i18n="addNewEvent">Add New Event for This Day:</h6>
                            <form id="quickAddForm">
                                <input type="hidden" id="taskDueDate">
                                
                                <div class="mb-3">
                                    <label class="form-label" for="taskTitle" data-i18n="eventTitle">Title</label>
                                    <input type="text" class="form-control" id="taskTitle" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label" for="eventType" data-i18n="eventType">Event Type</label>
                                    <select class="form-select" id="eventType">
                                        <option value="Meeting" data-i18n="typeMeeting">💼 Meeting</option>
                                        <option value="Exam" data-i18n="typeExam">📝 Exam</option>
                                        <option value="Assignment" data-i18n="typeAssignment">📚 Assignment / Project</option>
                                    </select>
                                </div>

                                <div class="text-end d-flex gap-2 justify-content-end">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="close">Close</button>
                                    <button type="submit" class="btn btn-primary" data-i18n="saveEvent">Save Event</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- FullCalendar JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

    <!-- JS File -->
    <script src="calendar.js"></script>
</body>
</html>
