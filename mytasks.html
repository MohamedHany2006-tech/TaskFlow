<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | My Tasks</title>

    <script>
        (function() {
            const savedLang = localStorage.getItem('language') || 'en';
            const savedTheme = localStorage.getItem('theme');
            const html = document.documentElement;

            if (savedLang === 'ar') {
                html.setAttribute('lang', 'ar');
                html.setAttribute('dir', 'rtl');
            } else {
                html.setAttribute('lang', 'en');
                html.setAttribute('dir', 'ltr');
            }

            if (savedTheme === 'dark') {
                html.classList.add('dark-mode');
            }
        })();
    </script>

    <!-- Bootstrap CSS CDN -->
    <link rel="stylesheet" id="bootstrapCss" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="mytasks.css">
    <link rel="stylesheet" href="theme-toggle.css">
    <script src="theme-toggle.js"></script>
</head>
<body>

<!-- Toast Notification Container -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
    <div id="liveToast" class="toast align-items-center text-white bg-success border-0 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body d-flex align-items-center gap-2">
                <i class="bi bi-check-circle-fill fs-5" id="toastIcon"></i>
                <span id="toastMessage">Task updated successfully!</span>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<!-- Mobile Navbar -->
<nav class="navbar navbar-dark bg-dark d-md-none px-3 mb-3">
    <a class="navbar-brand fw-bold" href="#">
        <i class="bi bi-check2-square me-1"></i> <span data-i18n="appName">TaskFlow</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar" aria-controls="mobileSidebar">
        <span class="navbar-toggler-icon"></span>
    </button>
</nav>

<div class="container-fluid">
    <div class="row">
        
        <!-- Sidebar Navigation -->
        <aside class="col-md-3 col-lg-2 offcanvas-md offcanvas-start bg-dark text-white p-3 min-vh-100 d-flex flex-column justify-content-between" id="mobileSidebar" tabindex="-1">
            <div class="w-100">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="text-white m-0">
                        <i class="bi bi-check2-square"></i> <span data-i18n="appName">TaskFlow</span>
                    </h3>
                    <button type="button" class="btn-close btn-close-white d-md-none" data-bs-dismiss="offcanvas" data-bs-target="#mobileSidebar" aria-label="Close"></button>
                </div>
                
                <ul class="nav flex-column gap-1">
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="dashboard.html">
                            <i class="bi bi-grid me-2"></i> <span data-i18n="dashboard">Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active text-white fw-bold" href="mytasks.html">
                            <i class="bi bi-list-task me-2"></i> <span data-i18n="myTasks">My Tasks</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="calendar.html">
                            <i class="bi bi-card-checklist me-2"></i> <span data-i18n="calendar">Calendar</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="profile.html">
                            <i class="bi bi-person me-2"></i> <span data-i18n="profile">Profile</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="settings.html">
                            <i class="bi bi-gear me-2"></i> <span data-i18n="settings">Settings</span>
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Logout Link -->
            <ul class="nav flex-column mt-auto pt-3 border-top border-secondary w-100">
                <li class="nav-item">
                    <a class="nav-link text-danger" href="index.html" onclick="logout()">
                        <i class="bi bi-box-arrow-right me-2"></i> <span data-i18n="logout">Logout</span>
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Main Content Wrapper -->
        <main class="col-md-9 col-lg-10 ms-sm-auto px-md-4 py-3">
            
            <!-- Header Section -->
            <header class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                <div>
                    <h2 class="fw-bold m-0" data-i18n="myTasks">My Tasks</h2>
                </div>
                
                <div class="d-flex align-items-center gap-2">
                    <!-- Notification Dropdown -->
                    <div class="dropdown">
                        <button class="btn btn-light position-relative rounded-circle shadow-sm p-2 notif-btn" type="button" id="notifDropdown" data-bs-toggle="dropdown" aria-expanded="false" title="Notifications">
                            <i class="bi bi-bell fs-5 text-secondary"></i>
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none" id="notifBadge">0</span>
                        </button>

                        <div class="dropdown-menu dropdown-menu-end shadow-lg border-0 mt-2 p-0 notif-dropdown" aria-labelledby="notifDropdown">
                            <div class="dropdown-header d-flex justify-content-between align-items-center p-3 border-bottom bg-light rounded-top">
                                <h6 class="m-0 fw-bold text-dark d-flex align-items-center gap-2">
                                    <i class="bi bi-bell-fill text-primary"></i> <span data-i18n="notifications">Notifications</span>
                                </h6>
                                <button class="btn btn-link btn-sm p-0 text-decoration-none text-muted extra-small hover-underline" onclick="clearNotifications()" data-i18n="clearAll">
                                    Clear All
                                </button>
                            </div>
                            
                            <ul class="list-unstyled mb-0 p-2" id="notifList" style="max-height: 320px; overflow-y: auto;">
                                <li id="emptyNotifMsg" class="text-center py-4 text-muted small">
                                    <i class="bi bi-inbox fs-3 d-block mb-1 text-black-50"></i>
                                    <span data-i18n="noNotifications">No new notifications</span>
                                </li>
                            </ul>
                        </div>
                    </div>

                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addTaskModal">
                        <i class="bi bi-plus-lg me-1"></i> <span data-i18n="addTask">Add Task</span>
                    </button>
                </div>
            </header>
            
            <!-- Filters & Search Bar -->
            <section class="row g-2 mb-4">
                <div class="col-12 col-md-5">
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text" id="searchInput" class="form-control" placeholder="Search tasks..." data-i18n-placeholder="searchPlaceholder">
                    </div>
                </div>
                
                <div class="col-12 col-sm-4 col-md-2">
                    <select class="form-select" id="statusFilter">
                        <option value="all" selected data-i18n="allStatuses">All Statuses</option>
                        <option value="Pending" data-i18n="statusPending">Pending</option>
                        <option value="In Progress" data-i18n="statusInProgress">In Progress</option>
                        <option value="Completed" data-i18n="statusCompleted">Completed</option>
                    </select>
                </div>
                
                <div class="col-12 col-sm-4 col-md-2">
                    <select class="form-select" id="priorityFilter">
                        <option value="all" selected data-i18n="allPriorities">All Priorities</option>
                        <option value="High" data-i18n="priorityHigh">High</option>
                        <option value="Medium" data-i18n="priorityMedium">Medium</option>
                        <option value="Low" data-i18n="priorityLow">Low</option>
                    </select>
                </div>
                
                <div class="col-12 col-sm-4 col-md-3">
                    <select class="form-select" id="categoryFilter">
                        <option value="all" selected data-i18n="allCategories">All Categories</option>
                        <option value="Work" data-i18n="categoryWork">Work</option>
                        <option value="Study" data-i18n="categoryStudy">Study</option>
                        <option value="Personal" data-i18n="categoryPersonal">Personal</option>
                    </select>
                </div>
            </section>

            <!-- Kanban Drag & Drop Board -->
            <section class="row g-3" id="kanbanBoard">
                <div class="col-12 col-md-4">
                    <div class="card bg-light border-0 shadow-sm p-3 h-100">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="fw-bold m-0 text-warning">
                                <i class="bi bi-clock-history me-2"></i><span data-i18n="statusPending">Pending</span>
                            </h5>
                            <span class="badge bg-warning text-dark rounded-pill" id="countPending">0</span>
                        </div>
                        <div class="drop-zone p-2 rounded flex-grow-1" id="Pending" data-status="Pending" style="min-height: 400px;"></div>
                    </div>
                </div>

                <div class="col-12 col-md-4">
                    <div class="card bg-light border-0 shadow-sm p-3 h-100">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="fw-bold m-0 text-primary">
                                <i class="bi bi-arrow-repeat me-2"></i><span data-i18n="statusInProgress">In Progress</span>
                            </h5>
                            <span class="badge bg-primary rounded-pill" id="countInProgress">0</span>
                        </div>
                        <div class="drop-zone p-2 rounded flex-grow-1" id="InProgress" data-status="In Progress" style="min-height: 400px;"></div>
                    </div>
                </div>

                <div class="col-12 col-md-4">
                    <div class="card bg-light border-0 shadow-sm p-3 h-100">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="fw-bold m-0 text-success">
                                <i class="bi bi-check-circle me-2"></i><span data-i18n="statusCompleted">Completed</span>
                            </h5>
                            <span class="badge bg-success rounded-pill" id="countCompleted">0</span>
                        </div>
                        <div class="drop-zone p-2 rounded flex-grow-1" id="Completed" data-status="Completed" style="min-height: 400px;"></div>
                    </div>
                </div>
            </section>

            <!-- Pagination Section -->
            <div class="d-flex justify-content-between align-items-center mt-4 px-2" id="paginationWrapper">
                <div class="text-muted small">
                    <span data-i18n="showing">Showing</span> <span id="pageStart">0</span> - <span id="pageEnd">0</span> <span data-i18n="of">of</span> <span id="totalItems">0</span> <span data-i18n="tasks">tasks</span>
                </div>
                <nav aria-label="Tasks pagination">
                    <ul class="pagination mb-0" id="paginationControls">
                        <li class="page-item disabled" id="prevPageBtn">
                            <button class="page-link" onclick="changePage(-1)" data-i18n="previous">Previous</button>
                        </li>
                        <li class="page-item" id="pageIndicator">
                            <span class="page-link text-dark fw-bold" id="currentPageNumber">Page 1</span>
                        </li>
                        <li class="page-item" id="nextPageBtn">
                            <button class="page-link" onclick="changePage(1)" data-i18n="next">Next</button>
                        </li>
                    </ul>
                </nav>
            </div>
        </main>
    </div>
</div>

<!-- Add Task Modal -->
<div class="modal fade" id="addTaskModal" tabindex="-1" aria-labelledby="addTaskModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered px-2">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="addTaskModalLabel" data-i18n="addNewTask">Add New Task</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="addTaskForm">
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="taskTitle" class="form-label fw-bold" data-i18n="taskTitle">Task Title</label>
                        <input type="text" class="form-control" id="taskTitle" placeholder="Enter task title" data-i18n-placeholder="titlePlaceholder" required>
                    </div>

                    <div class="mb-3">
                        <label for="taskDesc" class="form-label fw-bold" data-i18n="description">Description</label>
                        <textarea class="form-control" id="taskDesc" rows="3" placeholder="Enter task details" data-i18n-placeholder="descPlaceholder"></textarea>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-12 col-sm-6">
                            <label for="taskPriority" class="form-label fw-bold" data-i18n="priority">Priority</label>
                            <select class="form-select" id="taskPriority" required>
                                <option value="High" data-i18n="priorityHigh">High</option>
                                <option value="Medium" selected data-i18n="priorityMedium">Medium</option>
                                <option value="Low" data-i18n="priorityLow">Low</option>
                            </select>
                        </div>
                        <div class="col-12 col-sm-6">
                            <label for="taskCategory" class="form-label fw-bold" data-i18n="category">Category</label>
                            <select class="form-select" id="taskCategory" required>
                                <option value="Work" selected data-i18n="categoryWork">Work</option>
                                <option value="Study" data-i18n="categoryStudy">Study</option>
                                <option value="Personal" data-i18n="categoryPersonal">Personal</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="taskDate" class="form-label fw-bold" data-i18n="dueDate">Due Date</label>
                        <input type="date" class="form-control" id="taskDate" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary" data-i18n="saveTask">Save Task</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Edit Task Modal -->
<div class="modal fade" id="editTaskModal" tabindex="-1" aria-labelledby="editTaskModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered px-2">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="editTaskModalLabel" data-i18n="editTask">Edit Task</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="editTaskForm">
                <input type="hidden" id="editTaskId">
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="editTaskTitle" class="form-label fw-bold" data-i18n="taskTitle">Task Title</label>
                        <input type="text" class="form-control" id="editTaskTitle" required>
                    </div>

                    <div class="mb-3">
                        <label for="editTaskDesc" class="form-label fw-bold" data-i18n="description">Description</label>
                        <textarea class="form-control" id="editTaskDesc" rows="3"></textarea>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-12 col-sm-4">
                            <label for="editTaskPriority" class="form-label fw-bold" data-i18n="priority">Priority</label>
                            <select class="form-select" id="editTaskPriority" required>
                                <option value="High" data-i18n="priorityHigh">High</option>
                                <option value="Medium" data-i18n="priorityMedium">Medium</option>
                                <option value="Low" data-i18n="priorityLow">Low</option>
                            </select>
                        </div>
                        <div class="col-12 col-sm-4">
                            <label for="editTaskCategory" class="form-label fw-bold" data-i18n="category">Category</label>
                            <select class="form-select" id="editTaskCategory" required>
                                <option value="Work" data-i18n="categoryWork">Work</option>
                                <option value="Study" data-i18n="categoryStudy">Study</option>
                                <option value="Personal" data-i18n="categoryPersonal">Personal</option>
                            </select>
                        </div>
                        <div class="col-12 col-sm-4">
                            <label for="editTaskStatus" class="form-label fw-bold" data-i18n="status">Status</label>
                            <select class="form-select" id="editTaskStatus" required>
                                <option value="Pending" data-i18n="statusPending">Pending</option>
                                <option value="In Progress" data-i18n="statusInProgress">In Progress</option>
                                <option value="Completed" data-i18n="statusCompleted">Completed</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="editTaskDate" class="form-label fw-bold" data-i18n="dueDate">Due Date</label>
                        <input type="date" class="form-control" id="editTaskDate" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary" data-i18n="updateTask">Update Task</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap Bundle JS CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="mytasks.js"></script>
</body>
</html>
